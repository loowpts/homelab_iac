# Проверить на сервере

global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets:
        - 'worker.lab.local:9100'
        - 'wb01.lab.local:9100'
        - 'wb02.lab.local:9100'
        - 'db01.lab.local:9100'
        - 'cache01.lab.local:9100'
        - 'lb01.lab.local:9100'
        - 'monitor.lab.local:9100'

  - job_name: 'nginx'
    static_configs:
      - targets:
        - 'wb01.lab.local:9113'
        - 'wb02.lab.local:9113'
        - 'lb01.lab.local:9113'

  - job_name: 'postgres'
    static_configs:
      - targets:
        - 'db01.lab.local:9187'

  - job_name: 'redis'
    static_configs:
      - targets:
        - 'cache01.lab.local:9121'
