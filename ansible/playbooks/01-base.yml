---
- name: Базовая настройка всех VM
  hosts: all
  become: true

  tasks:
    - name: Обновить кэш пакетов
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    - name: Установить базовые пакеты
      apt:
        name: "{{ base_packages }}"
        state: present

    - name: Установить qemu-guest-agent
      apt:
        name: qemu-guest-agent
        state: present

    - name: Запустить qemu-guest-agent
      service:
        name: qemu-guest-agent
        state: started
        enabled: yes

    - name: Установить временную зону
      timezone:
        name: "{{ timezone }}"

    - name: Отключить swap
      command: swapoff -a
      changed_when: false

    - name: Убрать swap из fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Задеплоить netplan конфиг
      template:
        src: 50-cloud-init.yml.j2
        dest: /etc/netplan/50-cloud-init.yml
        owner: root
        mode: "0600"
      notify: Apply netplan

    - name: Настроить DNS сервер
      lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^#?DNS='
        line: "DNS={{ lb01_ip }}"
      notify: Restart resolved

    - name: Настроить домен
      lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^#?Domains='
        line: "Domains=lab.local"
      notify: Restart resolved

    - name: Отключить DNSStubListener
      lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^#?DNSStubListener='
        line: "DNSStubListener=no"
      notify: Restart resolved

    - name: Отключить avahi-daemon
      systemd:
        name: avahi-daemon
        enabled: no
        state: stopped
      ignore_errors: yes

    - name: Создать пользователя node_exporter
      user:
        name: node_exporter
        system: yes
        shell: /bin/false

    - name: Скачать node_exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz

    - name: Распаковать node_exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: Установить node_exporter
      copy:
        src: /tmp/node_exporter-1.8.2.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        owner: root
        mode: "0755"
        remote_src: yes

    - name: Создать systemd сервис node_exporter
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          Group=node_exporter
          ExecStart=/usr/local/bin/node_exporter
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Запустить node_exporter
      systemd:
        name: node_exporter
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: Apply netplan
      command: netplan apply

    - name: Restart resolved
      systemd:
        name: systemd-resolved
        state: restarted
