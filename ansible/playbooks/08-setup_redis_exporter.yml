---
- name: Установка Redis Exporter
  hosts: cache
  become: true

  tasks:
    - name: Установка Redis Exporter
      get_url:
        url: "https://github.com/oliver006/redis_exporter/releases/download/v1.58.0/redis_exporter-v1.58.0.linux-amd64.tar.gz"
        dest: /tmp/redis_exporter-v1.58.0.linux-amd64.tar.gz
        

    - name: Распаковать Redis Exporter
      unarchive:
        src: /tmp/redis_exporter-v1.58.0.linux-amd64.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: Переместить бинарный файл Redis Exporter
      copy:
        src: /tmp/redis_exporter-v1.58.0.linux-amd64/redis_exporter
        dest: /usr/local/bin/redis_exporter
        mode: '0755'
        remote_src: yes

    - name: Создать systemd unit файл для Redis Exporter
      copy:
        dest: /etc/systemd/system/redis_exporter.service
        content: |
          [Unit]
          Description=Redis Exporter
          After=network.target

          [Service]
          User=node_exporter
          Environment=REDIS_ADDR=redis://localhost:6379
          Environment=REDIS_PASSWORD={{ redis_password }}
          ExecStart=/usr/local/bin/redis_exporter
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Перезагрузить systemd и запустить Redis Exporter
      systemd:
        name: redis_exporter
        state: started
        enabled: true
        daemon_reload: yes

